[project]
name = "ai-engineering-portfolio"
version = "0.1.0"
description = "AI engineering learning and portfolio"
readme = "README.md"
authors = [
    { name = "Haya Toumy", email = "46117716+hayatoumy@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.140.13",
    "pandas>=3.0.5",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "uvicorn[standard]>=0.51.0",
]

[project.scripts]
ai-engineering-portfolio = "ai_engineering_portfolio:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"
