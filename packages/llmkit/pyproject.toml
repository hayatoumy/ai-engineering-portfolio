[project]
name = "llmkit"
version = "0.1.0"
description = "Small, well-tested utilities for building LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]