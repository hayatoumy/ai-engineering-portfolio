[project]
name = "llmkit"
version = "0.1.0"
description = "Small, well-tested utilities for building LLM applications."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = []

# dev and testing tools
[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

# make it installable; build instructions
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmkit"]

[tool.hatch.build.targets.wheel.force-include]
"src/llmkit/py.typed" = "llmkit/py.typed"
